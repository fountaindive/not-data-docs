name: Controlled Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v0.2.0)"
        required: true
        type: string

# Ensure the GitHub token has permission to create tags and releases
permissions:
  contents: write

jobs:
  # Job 1: Simulates your build/test phase
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Build/Test
        run: |
          echo "Running production build and tests for ${{ inputs.version }}..."
          # You can add npm run build, docker build, etc. here

  # Job 2: Pauses for approval before creating the release
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    
    # ⚠️ This must match the exact name of the environment you created in Step 1
    environment: release-approval 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Release ${{ needs.build.outputs.tag_name }}
          body: |
            ## Release Notes
            Automated release generated via GitHub Actions.
            
            Approved and deployed by the repository review team.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
