name: Controlled Release

on:
  push:
    tags:
      - 'v*' # Triggers automatically when any tag starting with 'v' is pushed

permissions:
  contents: write # Gives the default token permission to create the release page

jobs:
  # Job 1: Runs your standard build/test verification immediately upon tag push
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ github.ref_name }} # Grabs the tag name that was pushed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Build/Test
        run: |
          echo "Verifying code for tag ${{ github.ref_name }}..."
          # Add your test or build steps here

  # Job 2: Pauses for human approval BEFORE creating the GitHub Release page
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    
    # 🛑 This hooks into your GitHub Environment to require an approval click
    environment: release-approval 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Release ${{ needs.build.outputs.tag_name }}
          body: |
            ## Release Notes
            Automated release generated via GitHub Actions.
            
            Approved by the repository review team.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # No special admin tokens needed anymore!
